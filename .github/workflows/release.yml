# Push a version tag (v0.2.0) to build, sign with Developer ID, notarize and publish a release.
#
# One-time setup (repository → Settings → Secrets and variables → Actions):
#   ASC_KEY_ID         App Store Connect API key ID          (appstoreconnect.apple.com → Users and Access → Integrations)
#   ASC_ISSUER_ID      Issuer ID shown on the same page
#   ASC_KEY_P8_BASE64  The downloaded AuthKey_XXXX.p8, base64-encoded:  base64 -i AuthKey_XXXX.p8 | pbcopy
# The key needs the Admin role so Xcode can use the team's cloud-managed Developer ID certificate.
# Nothing secret is stored in the repo; the key file only exists for the duration of the job.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets and version
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_KEY_P8_BASE64" ]]; then
            echo "::error::App Store Connect API key secrets are not set. See the header of .github/workflows/release.yml, or release from a Mac with scripts/package-release.sh."
            exit 1
          fi
          version=$(awk -F': *' '/MARKETING_VERSION:/ {print $2; exit}' project.yml | tr -d '"')
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.yml"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build, sign, notarize and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          scripts/package-release.sh
          rm -f "$ASC_KEY_PATH"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/QuietHours-*.zip dist/QuietHours-*.zip.sha256 \
            --title "Quiet Hours ${GITHUB_REF_NAME#v}" --generate-notes

name: QuietHours

options:
  bundleIdPrefix: com.ashik.quiethours
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: HVFYWZDVQH
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    SWIFT_VERSION: "5.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO

targetTemplates:
  # One .saver per style, all from the same sources. Each gets its own Swift module so its classes
  # never clash with a sibling's when the host loads several savers into one process.
  Saver:
    type: bundle
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Resources/Fonts
        buildPhase: resources
      # System Settings tile: thumbnail.png / thumbnail@2x.png (scripts/make-thumbnails.sh)
      - path: "Resources/Thumbnails/${styleName}"
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "Quiet Hours – ${styleName}"
        PRODUCT_MODULE_NAME: "QuietHours${styleName}"
        PRODUCT_BUNDLE_IDENTIFIER: "com.ashik.quiethours.${styleId}"
        QH_STYLE: "${styleId}"
        COMBINE_HIDPI_IMAGES: NO      # ship thumbnail.png + @2x as-is, like Apple's savers
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: Sources/Saver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INSTALL_PATH: "$(HOME)/Library/Screen Savers"
        SKIP_INSTALL: YES

targets:
  QuietHoursHinge:
    templates: [Saver]
    templateAttributes: { styleId: hinge, styleName: Hinge }
  QuietHoursChorus:
    templates: [Saver]
    templateAttributes: { styleId: chorus, styleName: Chorus }
  QuietHoursBreath:
    templates: [Saver]
    templateAttributes: { styleId: breath, styleName: Breath }
  QuietHoursLumen:
    templates: [Saver]
    templateAttributes: { styleId: lumen, styleName: Lumen }
  QuietHoursProse:
    templates: [Saver]
    templateAttributes: { styleId: prose, styleName: Prose }

  # Plain app that hosts the same view in a resizable window. Day-to-day iteration happens here.
  QuietHoursPreview:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Preview
      - path: Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: QuietHoursPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.ashik.quiethours.preview
        INFOPLIST_FILE: Sources/Preview/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  QuietHoursTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QuietHoursTests
    dependencies:
      - target: QuietHoursPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashik.quiethours.tests
        GENERATE_INFOPLIST_FILE: YES
        # Tests only run on the dev Mac; XCTest itself requires 14.
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QuietHoursPreview.app/Contents/MacOS/QuietHoursPreview"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  # Builds all five savers.
  Savers:
    build:
      targets:
        QuietHoursHinge: all
        QuietHoursChorus: all
        QuietHoursBreath: all
        QuietHoursLumen: all
        QuietHoursProse: all
  QuietHoursPreview:
    build:
      targets:
        QuietHoursPreview: all
        QuietHoursTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuietHoursTests

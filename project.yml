name: QuietHours

options:
  bundleIdPrefix: com.ashik.quiethours
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: HVFYWZDVQH
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    SWIFT_VERSION: "5.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.2.1
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO

targetTemplates:
  # One .saver per style, all from the same sources. Each gets its own Swift module so its classes
  # never clash with a sibling's when the host loads several savers into one process.
  Saver:
    type: bundle
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Resources/Fonts
        buildPhase: resources
      # System Settings tile: thumbnail.png / thumbnail@2x.png (scripts/make-thumbnails.sh)
      - path: "Resources/Thumbnails/${styleName}"
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "Quiet Hours – ${styleName}"
        PRODUCT_MODULE_NAME: "QuietHours${styleName}"
        PRODUCT_BUNDLE_IDENTIFIER: "com.ashik.quiethours.${styleId}"
        QH_STYLE: "${styleId}"
        COMBINE_HIDPI_IMAGES: NO      # ship thumbnail.png + @2x as-is, like Apple's savers
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: Sources/Saver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INSTALL_PATH: "$(HOME)/Library/Screen Savers"
        SKIP_INSTALL: YES

targets:
  QuietHoursHinge:
    templates: [Saver]
    templateAttributes: { styleId: hinge, styleName: Hinge }
  QuietHoursChorus:
    templates: [Saver]
    templateAttributes: { styleId: chorus, styleName: Chorus }
  QuietHoursBreath:
    templates: [Saver]
    templateAttributes: { styleId: breath, styleName: Breath }
  QuietHoursLumen:
    templates: [Saver]
    templateAttributes: { styleId: lumen, styleName: Lumen }
  QuietHoursProse:
    templates: [Saver]
    templateAttributes: { styleId: prose, styleName: Prose }
  QuietHoursSlice:
    templates: [Saver]
    templateAttributes: { styleId: slice, styleName: Slice }
  QuietHoursPoster:
    templates: [Saver]
    templateAttributes: { styleId: poster, styleName: Poster }
  QuietHoursModule:
    templates: [Saver]
    templateAttributes: { styleId: module, styleName: Module }
  QuietHoursBoard:
    templates: [Saver]
    templateAttributes: { styleId: board, styleName: Board }
  QuietHoursSpecimen:
    templates: [Saver]
    templateAttributes: { styleId: specimen, styleName: Specimen }
  QuietHoursTicker:
    templates: [Saver]
    templateAttributes: { styleId: ticker, styleName: Ticker }
  QuietHoursShutter:
    templates: [Saver]
    templateAttributes: { styleId: shutter, styleName: Shutter }
  QuietHoursEcho:
    templates: [Saver]
    templateAttributes: { styleId: echo, styleName: Echo }

  # Packaging vehicle only (scripts/package-release.sh): Developer ID export and notarization
  # need an app archive, so this app carries the savers in Contents/PlugIns. Never shipped.
  QuietHoursRelease:
    type: application
    platform: macOS
    sources:
      - path: Sources/ReleaseCarrier
    dependencies:
      - target: QuietHoursHinge
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursChorus
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursBreath
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursLumen
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursProse
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursSlice
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursPoster
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursModule
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursBoard
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursSpecimen
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursTicker
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursShutter
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: QuietHoursEcho
        embed: true
        codeSign: true
        copy:
          destination: plugins
    settings:
      base:
        PRODUCT_NAME: QuietHoursRelease
        PRODUCT_BUNDLE_IDENTIFIER: com.ashik.quiethours.release
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quiet Hours Release Carrier

  # Plain app that hosts the same view in a resizable window. Day-to-day iteration happens here.
  QuietHoursPreview:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Preview
      - path: Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: QuietHoursPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.ashik.quiethours.preview
        INFOPLIST_FILE: Sources/Preview/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  QuietHoursTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QuietHoursTests
    dependencies:
      - target: QuietHoursPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashik.quiethours.tests
        GENERATE_INFOPLIST_FILE: YES
        # Tests only run on the dev Mac; XCTest itself requires 14.
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QuietHoursPreview.app/Contents/MacOS/QuietHoursPreview"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  # Builds every saver.
  Savers:
    build:
      targets:
        QuietHoursHinge: all
        QuietHoursChorus: all
        QuietHoursBreath: all
        QuietHoursLumen: all
        QuietHoursProse: all
        QuietHoursSlice: all
        QuietHoursPoster: all
        QuietHoursModule: all
        QuietHoursBoard: all
        QuietHoursSpecimen: all
        QuietHoursTicker: all
        QuietHoursShutter: all
        QuietHoursEcho: all
  QuietHoursRelease:
    build:
      targets:
        QuietHoursRelease: all
    archive:
      config: Release
  QuietHoursPreview:
    build:
      targets:
        QuietHoursPreview: all
        QuietHoursTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuietHoursTests
